# Render Blueprint: New + > Blueprint > chọn repo GitHub chứa project này.
# Kiểm tra lại tên gói (plan) trong tài liệu Render trước khi deploy, gói free có thể thay đổi.
envVarGroups:
  - name: mam-internal-services
    envVars:
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: mam-wellbeing
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: "./build.sh"
    startCommand: "uvicorn config.asgi:application --host 0.0.0.0 --port $PORT --workers 2"
    healthCheckPath: /accounts/login/
    envVars:
      - fromGroup: mam-internal-services
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: JOURNAL_ENCRYPTION_KEY       # giữ cố định: mất khóa này thì journal cũ không giải mã được
        generateValue: true
      - key: DATABASE_SYNC_SHARED_SECRET
        sync: false
      - key: DATABASE_SYNC_ENABLED
        value: "0"
      - key: COACH_SERVICE_URL
        value: http://mam-coach:10000
      - key: COACH_SERVICE_TIMEOUT
        value: "25"
      - key: EMAIL_HOST                    # SMTP để gửi email nhắc nhở
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_USE_SSL
        value: "0"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      - key: WELLBEING_NUDGE_FROM_HOUR
        value: "20"
      - key: WELLBEING_NUDGE_DROP_POINTS
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: mam-db
          property: connectionString

  - type: web
    name: mam-coach
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: "pip install -r requirements-prod.txt"
    startCommand: "uvicorn coach_service.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - fromGroup: mam-internal-services
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_AI_MODEL
        value: "@cf/meta/llama-3.1-8b-instruct"

databases:
  - name: mam-db
    plan: free
