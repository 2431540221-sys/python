{% extends "base.html" %}
{% block title %}Xóa journal{% endblock %}
{% block content %}
<div class="page-head"><h1>Xóa “{{ entry.title }}”?</h1></div>
<section class="panel form-narrow">
  <p>Bài journal này sẽ bị xóa vĩnh viễn.</p>
  <form method="post" class="btn-row">{% csrf_token %}<button class="btn danger" type="submit">Xóa journal</button><a class="btn ghost" href="{% url 'journal_detail' entry.pk %}">Giữ lại</a></form>
</section>
{% endblock %}
