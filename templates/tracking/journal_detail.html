{% extends "base.html" %}
{% block title %}{{ entry.title }}{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>{{ entry.title }}</h1><p class="muted small">{{ entry.created_at|date:"d/m/Y H:i" }}</p></div>
  <div class="btn-row"><a class="btn ghost" href="{% url 'journal_update' entry.pk %}">Sửa</a><a class="btn ghost" href="{% url 'journal_delete' entry.pk %}">Xóa</a></div>
</div>
<section class="panel">
  <p class="prose">{{ entry.content }}</p>
  {% for t in entry.tag_list %}<span class="badge">{{ t }}</span> {% endfor %}
</section>
<p><a href="{% url 'journal_list' %}">Quay lại danh sách</a></p>
{% endblock %}
