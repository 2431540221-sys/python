{% extends "base.html" %}
{% block title %}Xóa thói quen{% endblock %}
{% block content %}
<div class="page-head"><h1>Xóa “{{ habit.name }}”?</h1></div>
<section class="panel form-narrow">
  <p>Toàn bộ lịch sử hoàn thành và chuỗi của thói quen này sẽ bị xóa vĩnh viễn.</p>
  <form method="post" class="btn-row">{% csrf_token %}
    <button class="btn danger" type="submit">Xóa thói quen</button>
    <a class="btn ghost" href="{% url 'habit_detail' habit.pk %}">Giữ lại</a>
  </form>
</section>
{% endblock %}
